name: Apply Redlighte Inc. badge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[inc-badge-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add subtle badge to every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = '<script src="/redlighte-inc-badge.js"></script>'
          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if '/redlighte-inc-badge.js' in text:
                  continue
              marker = '</body>'
              if marker not in text:
                  continue
              path.write_text(text.replace(marker, tag + marker, 1), encoding='utf-8')
              changed.append(str(path))
          print(f'Updated {len(changed)} HTML pages')
          for item in changed:
              print(item)
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/apply-inc-badge.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add subtle Redlighte Inc. badge to all pages [inc-badge-applied]'
          git push
