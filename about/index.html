en:{name:'English',dir:'ltr',badge:'REDLIGHTE • INFORMATION',title:'Ask. Think. Create.',intro:'A simple, focused AI assistant built to make asking questions, thinking through ideas and creating things feel clear and effortless.',back:'Back',sections:[['About Redlighte','Redlighte is an AI assistant focused on a clean, lightweight experience. It is designed around a simple idea: give people a place to ask questions, explore ideas and create useful content without unnecessary complexity.'],['How Redlighte works','You send a message through the Redlighte interface. The request is sent to the Redlighte service, processed by the configured AI system, and the resulting response is returned to the conversation. The exact model or provider may change over time as the service evolves.'],['The experience','Redlighte is designed for web and mobile screens, with a focused interface, conversation history and simple controls. The goal is clarity first: fewer distractions, faster interaction and an interface that stays understandable.'],['Creator','Redlighte is created and developed by Sepehr. The project is independently designed and developed with the goal of building a simple, useful and modern AI experience.'],['Rules of use','Use Redlighte lawfully and responsibly. Do not use the service to harm people, violate privacy, impersonate others, distribute illegal material, abuse the service, attempt unauthorized access, or interfere with its availability or security.'],['AI limitations','AI responses can be incorrect, incomplete, outdated or misleading. Do not treat Redlighte as a substitute for qualified professional advice. Check important information independently, especially for medical, legal, financial, safety or other high-impact decisions.'],['Privacy & account safety','Keep your account credentials private and use the service only from devices and environments you trust. Do not submit passwords, payment details, private keys or other highly sensitive information unless the service explicitly requires it. Redlighte may store information necessary to provide its features, subject to its current technical implementation and privacy practices.'],['Fair use','Do not overload, scrape, reverse engineer, probe, bypass access controls, or attempt to disrupt Redlighte or its supporting services. Automated use should respect reasonable rate limits and the service rules.'],['Availability & changes','Redlighte is provided as an evolving project. Features, models, limits, availability and interface details may change, be temporarily unavailable, or be discontinued.'],['Acceptance','By using Redlighte, you agree to use it responsibly and to follow these rules. If you do not agree with them, please do not use the service. These rules are intended as service terms and do not replace applicable law.']],footer:'Built for clarity'},
fa:{name:'فارسی',dir:'rtl',badge:'ردلایت • اطلاعات',title:'بپرس. فکر کن. خلق کن.',intro:'ردلایت یک دستیار هوش مصنوعی ساده و متمرکز است که برای پرسیدن سؤال، بررسی ایده‌ها و ساختن محتوا با تجربه‌ای شفاف و راحت طراحی شده است.',back:'بازگشت',sections:[['ردلایت چیست؟','ردلایت یک دستیار هوش مصنوعی با تمرکز روی تجربه‌ای ساده و سبک است. ایده اصلی این پروژه این است که کاربر بتواند بدون پیچیدگی‌های اضافه سؤال بپرسد، ایده‌هایش را بررسی کند و چیزهای کاربردی بسازد.'],['ردلایت چگونه کار می‌کند؟','پیام شما از طریق رابط ردلایت ارسال می‌شود. درخواست به سرویس ردلایت می‌رسد، توسط سیستم هوش مصنوعی پیکربندی‌شده پردازش می‌شود و پاسخ به گفت‌وگو برگردانده می‌شود. مدل یا ارائه‌دهنده هوش مصنوعی ممکن است در طول توسعه سرویس تغییر کند.'],['تجربه کاربری','ردلایت برای نمایشگرهای موبایل و دسکتاپ طراحی شده و روی تجربه‌ای خلوت، تاریخچه گفت‌وگو و کنترل‌های ساده تمرکز دارد. هدف اصلی، شفافیت و استفاده راحت است.'],['سازنده','ردلایت توسط سپهر ساخته و توسعه داده می‌شود. این پروژه با هدف ساختن یک تجربه هوش مصنوعی ساده، کاربردی و مدرن به‌صورت مستقل طراحی و توسعه داده شده است.'],['قوانین استفاده','از ردلایت فقط به شکل قانونی و مسئولانه استفاده کنید. استفاده برای آسیب‌زدن به افراد، نقض حریم خصوصی، جعل هویت، انتشار محتوای غیرقانونی، سوءاستفاده از سرویس، دسترسی غیرمجاز یا ایجاد اختلال در امنیت و دسترسی سرویس ممنوع است.'],['محدودیت‌های هوش مصنوعی','پاسخ‌های هوش مصنوعی ممکن است اشتباه، ناقص، قدیمی یا گمراه‌کننده باشند. برای تصمیم‌های مهم پزشکی، حقوقی، مالی، ایمنی و موارد مشابه، پاسخ ردلایت را به‌تنهایی مبنا قرار ندهید و اطلاعات مهم را بررسی کنید.'],['حریم خصوصی و امنیت حساب','اطلاعات ورود حساب خود را در اختیار دیگران قرار ندهید و از سرویس در محیط‌های قابل اعتماد استفاده کنید. رمز عبور، کلید خصوصی، اطلاعات پرداخت و اطلاعات بسیار حساس را بدون نیاز واقعی در سرویس وارد نکنید. اطلاعات لازم برای ارائه قابلیت‌های سرویس ممکن است طبق پیاده‌سازی فنی و رویه‌های حریم خصوصی فعلی ذخیره شود.'],['استفاده منصفانه','از ایجاد بار غیرعادی روی سرویس، استخراج گسترده اطلاعات، مهندسی معکوس، بررسی یا دورزدن کنترل‌های دسترسی و ایجاد اختلال در ردلایت یا سرویس‌های پشتیبان خودداری کنید.'],['تغییرات و دسترسی','ردلایت یک پروژه در حال توسعه است. قابلیت‌ها، مدل‌ها، محدودیت‌ها، ظاهر و دسترسی سرویس ممکن است تغییر کنند یا موقتاً در دسترس نباشند.'],['پذیرش قوانین','با استفاده از ردلایت، می‌پذیرید که از سرویس مسئولانه استفاده کنید و قوانین آن را رعایت کنید. این متن قوانین استفاده از سرویس است و جایگزین قوانین لازم‌الاجرا نیست.']],footer:'ساخته‌شده برای شفافیت'},

};

const content=document.getElementById('content'),menu=document.getElementById('langMenu'),btn=document.getElementById('langBtn');
function render(code){const d=data[code]||data.en;document.documentElement.lang=code;document.body.classList.toggle('rtl',d.dir==='rtl');document.documentElement.dir=d.dir;document.getElementById('langLabel').textContent=d.name;document.querySelector('[data-i="badge"]').textContent=d.badge;document.querySelector('[data-i="title"]').textContent=d.title;document.querySelector('[data-i="intro"]').textContent=d.intro;document.querySelector('[data-i="back"]').textContent=d.back;content.innerHTML='';d.sections.forEach((s,i)=>{const card=document.createElement('article');card.className='card '+(i===0||i===1?'':'');card.innerHTML='<p class="eyebrow">'+String(i+1).padStart(2,'0')+'</p><h2></h2><p></p>';card.querySelector('h2').textContent=s[0];card.querySelector('p:last-child').textContent=s[1];content.append(card)});document.querySelector('[data-i="footer"]').textContent=d.footer;localStorage.setItem('redlighte_about_lang',code);document.title='Redlighte — '+d.name}
langs.forEach(code=>{const b=document.createElement('button');b.type='button';b.textContent=data[code].name;b.onclick=()=>{render(code);menu.classList.remove('open')};menu.append(b)});
btn.onclick=()=>menu.classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.lang'))menu.classList.remove('open')});render(localStorage.getItem('redlighte_about_lang')||'en');
</script>
</body></html>
