<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Agent Chat — Redlighte</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><style>:root{--bg:#070707;--panel:#111114;--line:rgba(255,255,255,.09);--text:#f5f5f7;--muted:#96969e;--red:#ff4057}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(255,40,65,.12),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.bar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;background:rgba(7,7,7,.75);backdrop-filter:blur(20px)}.back{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:11px;width:38px;height:38px}.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#ff405718;border:1px solid #ff405738;font-size:19px}.meta strong{display:block}.meta small{color:var(--muted)}main{width:min(900px,calc(100% - 28px));margin:auto;min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:flex-end;padding:35px 0 20px}.welcome{text-align:center;margin:auto;color:var(--muted)}.welcome h1{color:var(--text);font-size:34px;margin:10px}.messages{display:grid;gap:14px;margin-bottom:18px}.msg{max-width:78%;padding:13px 15px;border-radius:17px;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;background:#ff4057;color:white}.ai{background:#ffffff08;border:1px solid var(--line)}.composer{display:flex;gap:9px;padding:8px;border:1px solid var(--line);border-radius:18px;background:#ffffff08;backdrop-filter:blur(20px)}textarea{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:10px;resize:none;min-height:42px}.send{width:44px;border:0;border-radius:13px;background:var(--red);color:#fff;font-size:20px}.note{text-align:center;color:#696970;font-size:10px;margin-top:9px}@media(max-width:600px){.msg{max-width:90%}}</style></head><body><header class="bar"><button class="back" onclick="location.href='/agents/'">←</button><div class="avatar" id="icon">✦</div><div class="meta"><strong id="name">Agent</strong><small>Redlighte Agent</small></div></header><main><div class="welcome" id="welcome"><div class="avatar" style="margin:auto" id="bigIcon">✦</div><h1 id="welcomeName">Your agent</h1><p id="desc">Start a conversation.</p></div><div class="messages" id="messages"></div><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message your agent..."></textarea><button class="send" aria-label="Send">↑</button></form><div class="note">Your agent's instructions are applied to messages sent from this workspace.</div></main><script>const p=new URLSearchParams(location.search),id=p.get('agent');const agents=JSON.parse(localStorage.getItem('redlighte_agents_v1')||'[]');const a=agents.find(x=>x.id===id);if(!a){location.href='/agents/'}else{document.title=a.name+' — Redlighte';['name','welcomeName'].forEach(x=>document.getElementById(x).textContent=a.name);document.getElementById('icon').textContent=document.getElementById('bigIcon').textContent=a.icon;document.getElementById('desc').textContent=a.description||'A custom Redlighte AI agent.'}const form=document.getElementById('form'),input=document.getElementById('input'),messages=document.getElementById('messages'),welcome=document.getElementById('welcome');function add(text,who){welcome.style.display='none';const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';add(text,'user');const pending=add('Thinking…','ai');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,messages:[{role:'user',content:text}],system:`You are the Redlighte Agent named ${a.name}. ${a.instructions}`})});const data=await r.json();pending.textContent=data.reply||data.response||data.message||'I could not generate a response.'}catch(err){pending.textContent='The agent could not reach Redlighte AI right now.'}};</script></body></html>
