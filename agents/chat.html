<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Agent Chat — Redlighte</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><style>:root{--bg:#070707;--panel:#111114;--line:rgba(255,255,255,.09);--text:#f5f5f7;--muted:#96969e;--red:#ff4057}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(255,40,65,.12),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.bar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;background:rgba(7,7,7,.75);backdrop-filter:blur(20px)}button{cursor:pointer}.back{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:11px;width:38px;height:38px}.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#ff405718;border:1px solid #ff405738;font-size:19px}.meta strong{display:block}.meta small{color:var(--muted)}.memory{margin-left:auto;border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:11px;padding:9px 12px}.memory:hover{border-color:#ff4057}.memory-panel{width:min(900px,calc(100% - 28px));margin:14px auto 0;border:1px solid var(--line);background:#ffffff06;border-radius:16px;padding:14px;display:none}.memory-panel.open{display:block}.memory-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.memory-head strong{font-size:14px}.memory-head small{color:var(--muted)}.memory-list{display:grid;gap:8px;margin:12px 0}.memory-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#ffffff05}.memory-item span{flex:1;font-size:13px}.memory-item button{border:0;background:transparent;color:#aaa;font-size:17px}.memory-add{display:flex;gap:8px}.memory-add input{flex:1;background:#ffffff08;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;outline:0}.memory-add button{border:0;border-radius:10px;background:var(--red);color:white;padding:0 14px}.memory-suggestion{width:min(900px,calc(100% - 28px));margin:10px auto 0;border:1px solid #ff40574d;background:#ff40570b;border-radius:14px;padding:11px 12px;display:none;align-items:center;gap:10px}.memory-suggestion.open{display:flex}.memory-suggestion span{flex:1;font-size:12px;line-height:1.5}.memory-suggestion button{border:0;border-radius:9px;padding:7px 10px}.memory-save{background:var(--red);color:white}.memory-dismiss{background:#ffffff0a;color:var(--muted)}main{width:min(900px,calc(100% - 28px));margin:auto;min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:flex-end;padding:35px 0 20px}.welcome{text-align:center;margin:auto;color:var(--muted)}.welcome h1{color:var(--text);font-size:34px;margin:10px}.messages{display:grid;gap:14px;margin-bottom:18px}.msg{max-width:78%;padding:13px 15px;border-radius:17px;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;background:#ff4057;color:white}.ai{background:#ffffff08;border:1px solid var(--line)}.composer{display:flex;gap:9px;padding:8px;border:1px solid var(--line);border-radius:18px;background:#ffffff08;backdrop-filter:blur(20px)}textarea{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:10px;resize:none;min-height:42px}.send{width:44px;border:0;border-radius:13px;background:var(--red);color:#fff;font-size:20px}.note{text-align:center;color:#696970;font-size:10px;margin-top:9px}@media(max-width:600px){.msg{max-width:90%}.memory{padding:8px 9px;font-size:12px}.memory-suggestion{align-items:flex-start;flex-wrap:wrap}.memory-suggestion span{flex-basis:100%}}</style></head><body><header class="bar"><button class="back" onclick="location.href='/agents/'">←</button><div class="avatar" id="icon">✦</div><div class="meta"><strong id="name">Agent</strong><small>Redlighte Agent</small></div><button class="memory" id="memoryBtn">🧠 Memory</button></header><section class="memory-panel" id="memoryPanel"><div class="memory-head"><div><strong>Agent Memory</strong><br><small>Only this Agent uses these memories.</small></div></div><div class="memory-list" id="memoryList"></div><div class="memory-add"><input id="memoryInput" maxlength="300" placeholder="Add something this Agent should remember…"><button id="memoryAdd">Add</button></div></section><section class="memory-suggestion" id="memorySuggestion"><span id="memorySuggestionText"></span><button class="memory-save" id="memorySave">Remember</button><button class="memory-dismiss" id="memoryDismiss">Not now</button></section><main><div class="welcome" id="welcome"><div class="avatar" style="margin:auto" id="bigIcon">✦</div><h1 id="welcomeName">Your agent</h1><p id="desc">Start a conversation.</p></div><div class="messages" id="messages"></div><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message your agent..."></textarea><button class="send" aria-label="Send">↑</button></form><div class="note">This Agent uses its own memory and chat history.</div></main><script>const p=new URLSearchParams(location.search),id=p.get('agent');const KEY='redlighte_agents_v1';let agents=JSON.parse(localStorage.getItem(KEY)||'[]');let a=agents.find(x=>x.id===id);const messages=document.getElementById('messages'),welcome=document.getElementById('welcome');const historyKey=`redlighte_agent_history_${id}`,memoryKey=`redlighte_agent_memory_${id}`;let history=JSON.parse(localStorage.getItem(historyKey)||'[]');let memories=JSON.parse(localStorage.getItem(memoryKey)||'[]');let pendingMemory='';async function accountData(){const r=await fetch('/api/account/data',{credentials:'include',cache:'no-store'});if(!r.ok)throw new Error('account');return r.json()}async function loadCloud(){try{const data=await accountData();const cloudH=data?.settings?.agentHistories?.[id];const cloudM=data?.settings?.agentMemories?.[id];if(Array.isArray(cloudH)&&cloudH.length){history=cloudH.slice(-50);localStorage.setItem(historyKey,JSON.stringify(history))}if(Array.isArray(cloudM)){memories=cloudM.slice(0,50);localStorage.setItem(memoryKey,JSON.stringify(memories))}renderHistory();renderMemories()}catch(e){}}async function saveCloud(){try{const data=await accountData();const settings={...(data.settings||{}),agentHistories:{...(data.settings?.agentHistories||{}),[id]:history.slice(-50)},agentMemories:{...(data.settings?.agentMemories||{}),[id]:memories.slice(0,50)}};await fetch('/api/account/data',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings})})}catch(e){}}if(!a){location.href='/agents/'}else{document.title=a.name+' — Redlighte';['name','welcomeName'].forEach(x=>document.getElementById(x).textContent=a.name);document.getElementById('icon').textContent=document.getElementById('bigIcon').textContent=a.icon;document.getElementById('desc').textContent=a.description||'A custom Redlighte AI agent.'}function add(text,who,save=true){welcome.style.display='none';const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);if(save){history.push({role:who==='user'?'user':'assistant',content:text});history=history.slice(-50);localStorage.setItem(historyKey,JSON.stringify(history))}window.scrollTo(0,document.body.scrollHeight);return d}function renderHistory(){messages.innerHTML='';welcome.style.display=history.length?'none':'block';history.forEach(m=>{const d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'ai');d.textContent=m.content;messages.appendChild(d)})}function renderMemories(){const list=document.getElementById('memoryList');list.innerHTML='';memories.forEach((m,i)=>{const row=document.createElement('div');row.className='memory-item';const s=document.createElement('span');s.textContent=m;const b=document.createElement('button');b.textContent='×';b.onclick=async()=>{memories.splice(i,1);persistMemories();renderMemories();await saveCloud()};row.append(s,b);list.appendChild(row)});if(!memories.length){const e=document.createElement('small');e.style.color='#777';e.textContent='No memories yet.';list.appendChild(e)}}function persistMemories(){memories=memories.slice(0,50);localStorage.setItem(memoryKey,JSON.stringify(memories))}function detectMemory(text){const t=text.trim();if(t.length<8||t.length>240)return '';const patterns=[/\b(?:my name is|call me)\s+([^.!?\n]{2,60})/i,/\b(?:i am|i'm|i like|i love|i prefer|i use|i live in|i study)\s+([^.!?\n]{2,140})/i,/\b(?:remember that|don't forget that)\s+([^.!?\n]{2,180})/i];for(const re of patterns){const m=t.match(re);if(m){const value=(m[0]||'').replace(/\s+/g,' ').trim();if(!memories.some(x=>x.toLowerCase()===value.toLowerCase()))return value}}return ''}function showMemorySuggestion(text){pendingMemory=text;document.getElementById('memorySuggestionText').textContent=`🧠 Should I remember this for ${a.name}? “${text}”`;document.getElementById('memorySuggestion').classList.add('open')}function hideMemorySuggestion(){pendingMemory='';document.getElementById('memorySuggestion').classList.remove('open')}document.getElementById('memoryBtn').onclick=()=>document.getElementById('memoryPanel').classList.toggle('open');document.getElementById('memoryAdd').onclick=async()=>{const input=document.getElementById('memoryInput'),v=input.value.trim();if(!v)return;memories.unshift(v);input.value='';persistMemories();renderMemories();await saveCloud()};document.getElementById('memorySave').onclick=async()=>{if(!pendingMemory)return;memories.unshift(pendingMemory);persistMemories();renderMemories();hideMemorySuggestion();await saveCloud()};document.getElementById('memoryDismiss').onclick=hideMemorySuggestion;renderHistory();renderMemories();loadCloud();const form=document.getElementById('form'),input=document.getElementById('input');form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';hideMemorySuggestion();add(text,'user');const suggestedMemory=detectMemory(text);const pending=add('Thinking…','ai',false);const context=history.slice(-20);const memoryContext=memories.length?`\nPersistent memory for this Agent (use only when relevant):\n- ${memories.join('\n- ')}`:'';try{const r=await fetch('/api/chat',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,messages:context,system:`You are the Redlighte Agent named ${a.name}. ${a.instructions}${memoryContext}`})});const data=await r.json();const answer=data.reply||data.response||data.message||'I could not generate a response.';pending.textContent=answer;history.push({role:'assistant',content:answer});history=history.slice(-50);localStorage.setItem(historyKey,JSON.stringify(history));await saveCloud();if(suggestedMemory)showMemorySuggestion(suggestedMemory)}catch(err){pending.textContent='The agent could not reach Redlighte AI right now.';history.push({role:'assistant',content:pending.textContent});history=history.slice(-50);localStorage.setItem(historyKey,JSON.stringify(history))}};</script></body></html>
