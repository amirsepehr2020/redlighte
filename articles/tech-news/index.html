<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff2b3d"><meta name="description" content="تازه‌ترین مقاله‌های خبری Redlighte درباره هوش مصنوعی، تراشه‌ها و مهم‌ترین اتفاقات فناوری."><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="https://redlighte.ir/articles/tech-news/"><title>اخبار فناوری و هوش مصنوعی | ردلایت</title><link rel="stylesheet" href="/articles/articles.css"><link rel="stylesheet" href="/articles/font.css"></head><body><header class="articles-top"><a class="brand" href="/">Redlighte</a><a class="back" href="/articles/">← همه مقالات</a></header><main><section class="hero"><p class="eyebrow">REDLIGHTE / TECH NEWS</p><h1>اخبار فناوری و هوش مصنوعی</h1><p class="hero-copy">تحلیل فارسی اتفاقات مهم و تازه دنیای فناوری؛ با تمرکز روی AI، تراشه و زیرساخت.</p></section><section class="content"><div class="section-head"><div><p class="eyebrow">آرشیو کامل</p><h2>همه اخبار</h2></div></div><div id="articles" class="grid" aria-live="polite"></div><div id="empty" class="empty" hidden>هنوز خبری در این بخش منتشر نشده است.</div></section></main><footer><a href="/">Redlighte</a><span>•</span><a href="/articles/">مقالات</a></footer><script>const SOURCES=['/articles/data/articles.json','/articles/data/articles-more.json','/articles/data/articles-redlighte.json','/articles/data/articles-game.json'];const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const faDate=v=>{try{return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'long',day:'numeric'}).format(new Date(v+'T00:00:00'))}catch{return v||''}};Promise.all(SOURCES.map(u=>fetch(u).then(r=>r.json()))).then(ds=>{const seen=new Set();const list=ds.flatMap(d=>d.articles||[]).filter(a=>a.cluster==='tech-news'&&a.status==='published').filter(a=>{if(seen.has(a.id))return false;seen.add(a.id);return true}).sort((a,b)=>(Date.parse(b.publishedAt||b.updatedAt||'')||0)-(Date.parse(a.publishedAt||a.updatedAt||'')||0));$('#empty').hidden=list.length>0;$('#articles').innerHTML=list.map((a,i)=>`<a class="card fade" style="animation-delay:${Math.min(i*35,350)}ms" href="${esc(a.url)}"><div class="card-top"><span class="category">${esc(a.category==='ai'?'هوش مصنوعی':'تکنولوژی')}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.description)}</p><div class="meta"><span>${esc(a.readingTime)} دقیقه مطالعه</span><span>${esc(faDate(a.publishedAt))}</span></div></a>`).join('')}).catch(()=>{$('#empty').hidden=false});</script><script src="/redlighte-inc-badge.js"></script></body></html>
