<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>2048 — Redlighte Game</title><link rel="stylesheet" href="/game/game.css?v=20260901-6"><link rel="stylesheet" href="/game/2048.css?v=20260901-2"><link rel="stylesheet" href="/game/game-mobile-fix.css?v=20260901-1"></head><body class="standalone-game"><main class="standalone-shell"><div class="standalone-top"><button type="button" data-back-game>← Redlighte Game</button><span data-account-name>Redlighte Account</span></div><div id="gameModal"><div id="gameMount"></div></div></main><div class="toast" id="runtimeToast"></div><script>window.RedlighteGame={finish:async(game,score,win)=>{try{const r=await fetch('/api/account/data',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return false;const j=await r.json(),g={...(j.settings?.game||{})};g.gamesPlayed=(Number(g.gamesPlayed)||0)+1;g.xp=(Number(g.xp)||0)+10+Math.min(30,Math.max(0,Math.round(score)))+(win?20:0);g.coins=(Number(g.coins)||0)+(win?15:5);g.wins=(Number(g.wins)||0)+(win?1:0);g.playedOriginals=Array.isArray(g.playedOriginals)?g.playedOriginals:[];if(!g.playedOriginals.includes(game))g.playedOriginals.push(game);await fetch('/api/account/data',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({settings:{game:g}})});return true}catch{return false}}};(async()=>{try{const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});const j=await r.json();if(!r.ok||!j.authenticated){location.href='/?account=login&return='+encodeURIComponent(location.pathname);return}document.querySelector('[data-account-name]').textContent=j.user?.name||j.user?.username||'Redlighte Account';document.querySelector('[data-back-game]').onclick=()=>location.href='/game/';}catch{location.href='/?account=login&return='+encodeURIComponent(location.pathname)}})();</script><script src="/game/2048.js?v=20260901-2" defer></script><script>window.addEventListener('load',()=>window.Redlighte2048?.start());</script></body></html>
