<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Redlighte — ask, think and create with AI."><meta name="color-scheme" content="dark light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Redlighte"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/icon-192.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/auth.css"><title>Redlighte — AI</title><style>body:not(.auth-ready) #app{visibility:hidden}.language-subtitle{margin:0 0 14px;color:var(--muted);font-size:13px}.language-list{display:grid;gap:8px}.language-choice{width:100%;display:grid;grid-template-columns:34px 1fr 24px;align-items:center;gap:10px;text-align:left;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);cursor:pointer;transition:.2s var(--ease)}.language-choice:hover{border-color:var(--line2);background:var(--surface3)}.language-choice.active{border-color:var(--red);box-shadow:0 0 0 3px var(--redSoft)}.language-flag{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--redSoft);font-size:15px}.language-name{font-size:13px;font-weight:650}.language-check{opacity:0;color:var(--red2);font-weight:800}.language-choice.active .language-check{opacity:1}.nav-leading{display:flex;align-items:center;gap:11px}.nav-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--redSoft);color:var(--red2);font-size:14px}.nav-arrow{font-size:20px;color:var(--dim);line-height:1}.history-search{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}.history-search-icon{color:var(--dim);font-size:14px}.history-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}.history-search input::placeholder{color:var(--dim)}.history-search-clear{display:none;border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:15px;padding:0 2px}.history-search-clear.show{display:block}.history-search-results{display:grid;gap:8px}.history-search-result{width:100%;display:block;text-align:left;border:1px solid var(--line);border-radius:13px;background:var(--surface2);padding:10px 11px;cursor:pointer}.history-search-result:hover{border-color:var(--line2);background:var(--surface3)}.history-search-title{display:block;color:var(--text);font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-search-match{display:block;margin-top:4px;color:var(--dim);font-size:10px}.history-search-empty{margin:2px 0 10px;color:var(--dim);font-size:11px}.panel-section:has(#historySearchResults:not([hidden])) #historyList{display:none}.share-chat-button{display:none}.share-preview{max-height:min(52svh,420px);overflow:auto;white-space:pre-wrap;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--text);font-size:12px;line-height:1.65;text-align:left}.share-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px}.share-copy{width:auto!important;margin:0!important;justify-content:center!important}.share-primary{width:40px;height:40px;flex:0 0 40px}.share-chat-button:not([hidden]){display:grid}</style></head><body><div class="app-shell" id="app"><header class="topbar"><button class="brand" id="brandButton" aria-label="Go to Redlighte home"><span class="brand-mark"><span></span></span><span class="brand-name">Redlighte</span></button><div class="topbar-actions"><button class="icon-button" id="newChatButton" aria-label="Start new chat">＋</button><button class="icon-button" id="shareChatButtonPlaceholder" aria-hidden="true" hidden>↗</button><button class="icon-button" id="menuButton" aria-label="Open navigation menu">☰</button></div></header><main class="main-content"><section class="welcome-view" id="welcomeView"><div class="ambient-glow"></div><div class="welcome-content"><div class="hero-mark" aria-hidden="true"><span></span></div><p class="eyebrow">REDLIGHTE AI</p><h1>What can I help you with?</h1><p class="hero-copy">Ask anything. Think clearly. Create freely.</p><form class="composer" id="homeComposer"><label class="sr-only" for="homeInput">Ask Redlighte anything</label><textarea id="homeInput" rows="1" maxlength="12000" placeholder="" autocomplete="off" spellcheck="true"></textarea><button class="send-button" type="submit" aria-label="Send message" disabled>↑</button></form><div class="suggestions" aria-label="Suggested prompts"><button class="suggestion" type="button" data-prompt="Explain quantum computing in simple terms">Explain something</button><button class="suggestion" type="button" data-prompt="Write a clean Python function that sorts a list">Write code</button><button class="suggestion" type="button" data-prompt="Give me three creative ideas for a short video">Brainstorm ideas</button></div></div></section><section class="chat-view" id="chatView" hidden aria-label="Conversation"><div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div></section></main><footer class="app-footer" id="appFooter">Redlighte AI <span>•</span> Built for clarity</footer><div class="bottom-composer" id="bottomComposer" hidden><form class="composer" id="chatComposer"><label class="sr-only" for="chatInput">Message Redlighte</label><textarea id="chatInput" rows="1" maxlength="12000" placeholder="Message Redlighte..." autocomplete="off" spellcheck="true"></textarea><button class="send-button" type="submit" aria-label="Send message" disabled>↑</button></form><p>Redlighte can make mistakes. Check important information.</p></div><aside class="side-panel" id="sidePanel" aria-hidden="true" aria-label="Redlighte navigation"><div class="panel-backdrop" id="panelBackdrop"></div><div class="panel-sheet"><div class="panel-header"><span>Redlighte</span><button class="icon-button" id="closeMenuButton" aria-label="Close navigation">×</button></div><button class="panel-action" id="panelNewChat" type="button">＋ New chat</button><div class="panel-divider"></div><div class="panel-section"><p class="panel-label">Recent chats</p><div class="history-search" id="historySearchBox" hidden><span class="history-search-icon">⌕</span><input id="historySearchInput" type="search" placeholder="Search chats..." autocomplete="off"><button class="history-search-clear" id="historySearchClear" type="button" aria-label="Clear search">×</button></div><div id="historyList" class="history-list"><p class="panel-copy">Your conversations will appear here.</p></div><div id="historySearchResults" class="history-search-results" hidden></div></div><div class="panel-section"><p class="panel-label">Settings</p><button class="panel-action navigation-action" id="appearanceSettingsButton" type="button"><span class="nav-leading"><span class="nav-icon">◐</span><span>Appearance</span></span><span class="nav-arrow">›</span></button><button class="panel-action" id="settingsButton" type="button"><span class="nav-leading"><span class="nav-icon">⚙</span><span>Settings</span></span><span class="nav-arrow">›</span></button><button class="panel-action" id="aboutButton" type="button"><span class="nav-leading"><span class="nav-icon">ⓘ</span><span>About Redlighte</span></span><span class="nav-arrow">›</span></button></div></div></aside><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-backdrop" id="modalBackdrop"></div><div class="modal-card"><div class="modal-header"><b id="modalTitle"></b><button class="icon-button" id="modalClose" aria-label="Close dialog">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script type="module" src="/app.js"></script><script src="/language2.js"></script><script src="/share.js"></script><script src="/auth.js"></script><script src="/pwa.js"></script></body></html>
