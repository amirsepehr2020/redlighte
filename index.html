<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Redlighte — ask, think and create with AI."><meta name="color-scheme" content="dark light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Redlighte"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/icon-192.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/vazir-font.css"><link rel="stylesheet" href="/share.css"><link rel="stylesheet" href="/history-search.css"><link rel="stylesheet" href="/language-menu.css"><title>Redlighte — AI</title></head><body><div class="app-shell" id="app"><header class="topbar"><button class="brand" id="brandButton" aria-label="Go to Redlighte home"><span class="brand-mark"><span></span></span><span class="brand-name">Redlighte</span></button><div class="topbar-actions"><button class="icon-button" id="newChatButton" aria-label="Start new chat">＋</button><button class="icon-button" id="shareChatButtonPlaceholder" aria-hidden="true" hidden>↗</button><button class="icon-button" id="menuButton" aria-label="Open navigation menu">☰</button></div></header><main class="main-content"><section class="welcome-view" id="welcomeView"><div class="ambient-glow"></div><div class="welcome-content"><div class="hero-mark" aria-hidden="true"><span></span></div><p class="eyebrow">REDLIGHTE AI</p><h1>What can I help you with?</h1><p class="hero-copy">Ask anything. Think clearly. Create freely.</p><form class="composer" id="homeComposer"><label class="sr-only" for="homeInput">Ask Redlighte anything</label><textarea id="homeInput" rows="1" maxlength="12000" placeholder="" autocomplete="off" spellcheck="true"></textarea><button class="send-button" type="submit" aria-label="Send message" disabled>↑</button></form><div class="suggestions" aria-label="Suggested prompts"><button class="suggestion" type="button" data-prompt="Explain quantum computing in simple terms">Explain something</button><button class="suggestion" type="button" data-prompt="Write a clean Python function that sorts a list">Write code</button><button class="suggestion" type="button" data-prompt="Give me three creative ideas for a short video">Brainstorm ideas</button></div></div></section><section class="chat-view" id="chatView" hidden aria-label="Conversation"><div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div></section></main><footer class="app-footer" id="appFooter">Redlighte AI <span>•</span> Built for clarity</footer><div class="bottom-composer" id="bottomComposer" hidden><form class="composer" id="chatComposer"><label class="sr-only" for="chatInput">Message Redlighte</label><textarea id="chatInput" rows="1" maxlength="12000" placeholder="Message Redlighte..." autocomplete="off" spellcheck="true"></textarea><button class="send-button" type="submit" aria-label="Send message" disabled>↑</button></form><p>Redlighte can make mistakes. Check important information.</p></div><aside class="side-panel" id="sidePanel" aria-hidden="true" aria-label="Redlighte navigation"><div class="panel-backdrop" id="panelBackdrop"></div><div class="panel-sheet"><div class="panel-header"><span>Redlighte</span><button class="icon-button" id="closeMenuButton" aria-label="Close navigation">×</button></div><button class="panel-action" id="panelNewChat" type="button">＋ New chat</button><button class="panel-action" id="accountButton" type="button"><span class="nav-leading"><span class="nav-icon">◉</span><span>Redlighte Account</span></span><span class="nav-arrow">›</span></button><div class="panel-divider"></div><div class="panel-section"><p class="panel-label">Recent chats</p><div class="history-search" id="historySearchBox" hidden><span class="history-search-icon" aria-hidden="true">⌕</span><input id="historySearchInput" type="search" placeholder="Search your chats..." autocomplete="off" aria-label="Search your chats"><button class="history-search-clear" id="historySearchClear" type="button" aria-label="Clear search">×</button></div><div id="historyList" class="history-list"><p class="panel-copy">Your conversations will appear here.</p></div><div id="historySearchResults" class="history-search-results" hidden></div></div><div class="panel-section"><p class="panel-label">Settings</p><button class="panel-action navigation-action" id="appearanceSettingsButton" type="button"><span class="nav-leading"><span class="nav-icon">◐</span><span>Appearance</span></span><span class="nav-arrow">›</span></button><button class="panel-action" id="settingsButton" type="button"><span class="nav-leading"><span class="nav-icon">⚙</span><span>Settings</span></span><span class="nav-arrow">›</span></button><button class="panel-action" id="aboutButton" type="button"><span class="nav-leading"><span class="nav-icon">ⓘ</span><span>About Redlighte</span></span><span class="nav-arrow">›</span></button></div></div></aside><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-backdrop" id="modalBackdrop"></div><div class="modal-card"><div class="modal-header"><b id="modalTitle"></b><button class="icon-button" id="modalClose" aria-label="Close dialog">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script type="module" src="/app.js"></script><script src="/language2.js"></script><script src="/hero-rotation.js"></script><script src="/share.js"></script><script src="/pwa.js"></script><script src="/history-search.js"></script><script src="/auth.js"></script><script src="/account-menu.js"></script><script>(function(){if(!('ontouchstart' in window))return;var startX=0,startY=0;document.addEventListener('touchstart',function(e){if(window.innerWidth>768||!e.touches.length)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',function(e){if(window.innerWidth>768||!e.changedTouches.length)return;var endX=e.changedTouches[0].clientX,endY=e.changedTouches[0].clientY,dx=endX-startX,dy=endY-startY;if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.25){var drawer=document.getElementById('sidePanel');if(drawer&&!drawer.classList.contains('open')){var button=document.getElementById('menuButton');if(button)button.click()}}},{passive:true})})();</script></body></html>
