<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Redlighte — ask, think and create with AI."><meta name="color-scheme" content="dark light"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><title>Redlighte — AI</title><style>.language-subtitle{margin:0 0 14px;color:var(--muted);font-size:13px}.language-list{display:grid;gap:8px}.language-choice{width:100%;display:grid;grid-template-columns:34px 1fr 24px;align-items:center;gap:10px;text-align:left;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);cursor:pointer;transition:.2s var(--ease)}.language-choice:hover{border-color:var(--line2);background:var(--surface3)}.language-choice.active{border-color:var(--red);box-shadow:0 0 0 3px var(--redSoft)}.language-flag{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--redSoft);font-size:15px}.language-name{font-size:13px;font-weight:650}.language-check{opacity:0;color:var(--red2);font-weight:800}.language-choice.active .language-check{opacity:1}.nav-leading{display:flex;align-items:center;gap:11px}.nav-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--redSoft);color:var(--red2);font-size:14px}.nav-arrow{font-size:20px;color:var(--dim);line-height:1}</style></head><body><div class="app-shell" id="app"><header class="topbar"><button class="brand" id="brandButton" aria-label="Go to Redlighte home"><span class="brand-mark"><span></span></span><span class="brand-name">Redlighte</span></button><div class="topbar-actions"><button class="icon-button" id="newChatButton" aria-label="Start new chat">＋</button><button class="icon-button" id="menuButton" aria-label="Open navigation menu">☰</button></div></header><main class="main-content"><section class="welcome-view" id="welcomeView"><div class="ambient-glow"></div><div class="welcome-content"><div class="hero-mark" aria-hidden="true"><span></span></div><p class="eyebrow">REDLIGHTE AI</p><h1>What can I help you with?</h1><p class="hero-copy">Ask anything. Think clearly. Create freely.</p><form class="composer" id="homeComposer"><label class="sr-only" for="homeInput">Ask Redlighte anything</label><textarea id="homeInput" rows="1" maxlength="12000" placeholder="Ask Redlighte anything..." autocomplete="off" spellcheck="true"></textarea><button class="send-button" type="submit" aria-label="Send message" disabled>↑</button></form><div class="suggestions" aria-label="Suggested prompts"><button class="suggestion" type="button" data-prompt="Explain quantum computing in simple terms">Explain something</button><button class="suggestion" type="button" data-prompt="Write a clean Python function that sorts a list">Write code</button><button class="suggestion" type="button" data-prompt="Give me three creative ideas for a short video">Brainstorm ideas</button></div></div></section><section class="chat-view" id="chatView" hidden aria-label="Conversation"><div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div></section></main><footer class="app-footer" id="appFooter">Redlighte AI <span>•</span> Built for clarity</footer><div class="bottom-composer" id="bottomComposer" hidden><form class="composer" id="chatComposer"><label class="sr-only" for="chatInput">Message Redlighte</label><textarea id="chatInput" rows="1" maxlength="12000" placeholder="Message Redlighte..." autocomplete="off" spellcheck="true"></textarea><button class="send-button" type="submit" aria-label="Send message" disabled>↑</button></form><p>Redlighte can make mistakes. Check important information.</p></div><aside class="side-panel" id="sidePanel" aria-hidden="true" aria-label="Redlighte navigation"><div class="panel-backdrop" id="panelBackdrop"></div><div class="panel-sheet"><div class="panel-header"><span>Redlighte</span><button class="icon-button" id="closeMenuButton" aria-label="Close navigation">×</button></div><button class="panel-action" id="panelNewChat" type="button">＋ New chat</button><div class="panel-divider"></div><div class="panel-section"><p class="panel-label">Recent chats</p><div id="historyList" class="history-list"><p class="panel-copy">Your conversations will appear here.</p></div></div><div class="panel-section"><p class="panel-label">Settings</p><button class="panel-action navigation-action" id="appearanceSettingsButton" type="button"><span class="nav-leading"><span class="nav-icon">◐</span><span>Appearance</span></span><span class="nav-arrow">›</span></button><button class="panel-action" id="settingsButton" type="button"><span class="nav-leading"><span class="nav-icon">⚙</span><span>Settings</span></span><span class="nav-arrow">›</span></button><button class="panel-action" id="aboutButton" type="button"><span class="nav-leading"><span class="nav-icon">ⓘ</span><span>About Redlighte</span></span><span class="nav-arrow">›</span></button></div></div></aside><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-backdrop" id="modalBackdrop"></div><div class="modal-card"><div class="modal-header"><b id="modalTitle"></b><button class="icon-button" id="modalClose" aria-label="Close dialog">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script type="module" src="/app.js"></script><script src="/language.js"></script></body></html>
