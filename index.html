<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Redlighte — ask, think and create with AI."><meta name="color-scheme" content="dark"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><title>Redlighte — AI</title></head><body><div class="app-shell" id="app"><header class="topbar"><button class="brand" id="brandButton" aria-label="Go to home"><span class="brand-mark"><span></span></span><span class="brand-name">Redlighte</span></button><div class="topbar-actions"><button class="icon-button" id="newChatButton" aria-label="New chat">＋</button><button class="icon-button" id="menuButton" aria-label="Open menu">☰</button></div></header><main class="main-content"><section class="welcome-view" id="welcomeView"><div class="ambient-glow"></div><div class="welcome-content"><div class="hero-mark"><span></span></div><p class="eyebrow">REDLIGHTE AI</p><h1>What can I help you with?</h1><p class="hero-copy">Ask anything. Think clearly. Create freely.</p><form class="composer" id="homeComposer"><label class="sr-only" for="homeInput">Ask Redlighte anything</label><textarea id="homeInput" rows="1" maxlength="12000" placeholder="Ask Redlighte anything..." autocomplete="off"></textarea><button class="send-button" type="submit" aria-label="Send" disabled>↑</button></form><div class="suggestions"><button class="suggestion" data-prompt="Explain quantum computing in simple terms">Explain something</button><button class="suggestion" data-prompt="Write a clean Python function that sorts a list">Write code</button><button class="suggestion" data-prompt="Give me three creative ideas for a short video">Brainstorm ideas</button></div></div></section><section class="chat-view" id="chatView" hidden aria-label="Conversation"><div class="messages" id="messages" role="log" aria-live="polite"></div></section></main><footer class="app-footer" id="appFooter">Redlighte AI <span>•</span> Built for clarity</footer><div class="bottom-composer" id="bottomComposer" hidden><form class="composer" id="chatComposer"><label class="sr-only" for="chatInput">Message Redlighte</label><textarea id="chatInput" rows="1" maxlength="12000" placeholder="Message Redlighte..." autocomplete="off"></textarea><button class="send-button" type="submit" aria-label="Send" disabled>↑</button></form><p>Redlighte can make mistakes. Check important information.</p></div><aside class="side-panel" id="sidePanel" aria-hidden="true"><div class="panel-backdrop" id="panelBackdrop"></div><div class="panel-sheet"><div class="panel-header"><span>Redlighte</span><button class="icon-button" id="closeMenuButton" aria-label="Close">×</button></div><button class="panel-action" id="panelNewChat">＋ New chat</button><div class="panel-divider"></div><div class="panel-section"><p class="panel-label">Recent chats</p><p class="panel-copy">Your conversations will appear here.</p></div><div class="panel-section"><p class="panel-label">Settings</p><button class="panel-action" id="settingsButton">Appearance <span>Dark</span></button><button class="panel-action" id="aboutButton">About Redlighte <span>›</span></button></div></div></aside><div class="modal" id="modal" hidden><div class="modal-backdrop" id="modalBackdrop"></div><div class="modal-card"><div class="modal-header"><b id="modalTitle"></b><button class="icon-button" id="modalClose">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script type="module" src="/app.js"></script></body></html>
