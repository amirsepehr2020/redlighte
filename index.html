<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Redlighte — ask, think and create with AI."><meta name="color-scheme" content="dark light"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><title>Redlighte — AI</title></head><body><div class="app-shell" id="app"><header class="topbar"><button class="brand" id="brandButton" aria-label="Go to Redlighte home"><span class="brand-mark"><span></span></span><span class="brand-name">Redlighte</span></button><div class="topbar-actions"><button class="icon-button" id="newChatButton" aria-label="Start new chat">＋</button><button class="icon-button" id="menuButton" aria-label="Open navigation menu">☰</button></div></header><main class="main-content"><section class="welcome-view" id="welcomeView"><div class="ambient-glow"></div><div class="welcome-content"><div class="hero-mark" aria-hidden="true"><span></span></div><p class="eyebrow">REDLIGHTE AI</p><h1>What can I help you with?</h1><p class="hero-copy">Ask anything. Think clearly. Create freely.</p><form class="composer" id="homeComposer"><label class="sr-only" for="homeInput">Ask Redlighte anything</label><textarea id="homeInput" rows="1" maxlength="12000" placeholder="Ask Redlighte anything..." autocomplete="off" spellcheck="true"></textarea><button class="send-button" type="submit" aria-label="Send message" disabled>↑</button></form><div class="suggestions" aria-label="Suggested prompts"><button class="suggestion" type="button" data-prompt="Explain quantum computing in simple terms">Explain something</button><button class="suggestion" type="button" data-prompt="Write a clean Python function that sorts a list">Write code</button><button class="suggestion" type="button" data-prompt="Give me three creative ideas for a short video">Brainstorm ideas</button></div></div></section><section class="chat-view" id="chatView" hidden aria-label="Conversation"><div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div></section></main><footer class="app-footer" id="appFooter">Redlighte AI <span>•</span> Built for clarity</footer><div class="bottom-composer" id="bottomComposer" hidden><form class="composer" id="chatComposer"><label class="sr-only" for="chatInput">Message Redlighte</label><textarea id="chatInput" rows="1" maxlength="12000" placeholder="Message Redlighte..." autocomplete="off" spellcheck="true"></textarea><button class="send-button" type="submit" aria-label="Send message" disabled>↑</button></form><p>Redlighte can make mistakes. Check important information.</p></div><aside class="side-panel" id="sidePanel" aria-hidden="true" aria-label="Redlighte navigation"><div class="panel-backdrop" id="panelBackdrop"></div><div class="panel-sheet"><div class="panel-header"><span>Redlighte</span><button class="icon-button" id="closeMenuButton" aria-label="Close navigation">×</button></div><button class="panel-action" id="panelNewChat" type="button">＋ New chat</button><div class="panel-divider"></div><div class="panel-section"><p class="panel-label">Recent chats</p><div id="historyList" class="history-list"><p class="panel-copy">Your conversations will appear here.</p></div></div><div class="panel-section"><p class="panel-label">Settings</p><button class="panel-action theme-action" id="themeButton" type="button"><span>Appearance</span><span><span class="theme-icon">☾</span> <span class="theme-name">Dark</span></span></button><div id="redPalette" aria-label="Red color themes"></div><button class="panel-action" id="settingsButton" type="button">Settings <span>›</span></button><button class="panel-action" id="aboutButton" type="button">About Redlighte <span>›</span></button></div></div></aside><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-backdrop" id="modalBackdrop"></div><div class="modal-card"><div class="modal-header"><b id="modalTitle"></b><button class="icon-button" id="modalClose" aria-label="Close dialog">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script>(function(){const root=document.documentElement,p=document.getElementById('redPalette'),btn=document.getElementById('themeButton'),colors=[['Ruby','#e11d48'],['Crimson','#dc2626'],['Scarlet','#ef233c'],['Classic Red','#ff3045'],['Vermilion','#ff3b30'],['Cherry','#ff1744'],['Rose','#f43f5e'],['Deep Red','#b91c1c']];const key='redlighte_accent';const saved=localStorage.getItem(key)||colors[3][1];function setAccent(c){root.style.setProperty('--red',c);const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);root.style.setProperty('--red2',`rgb(${Math.min(255,r+28)},${Math.min(255,g+28)},${Math.min(255,b+28)})`);root.style.setProperty('--redSoft',`rgba(${r},${g},${b},.12)`);root.style.setProperty('--accent-color',c);localStorage.setItem(key,c);p.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.color===c?'true':'false'))}p.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:-1px 0 12px;padding:0 2px';colors.forEach(([name,color])=>{const x=document.createElement('button');x.type='button';x.dataset.color=color;x.title=name;x.setAttribute('aria-label',name);x.innerHTML='<span></span>';x.style.cssText='height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer;display:grid;place-items:center;padding:0;transition:.2s ease';const dot=x.firstElementChild;dot.style.cssText=`width:18px;height:18px;border-radius:50%;background:${color};box-shadow:0 0 12px ${color}66`;x.addEventListener('click',e=>{e.stopPropagation();setAccent(color)});p.appendChild(x)});p.querySelectorAll('button').forEach(x=>x.addEventListener('mouseenter',()=>x.style.borderColor=x.dataset.color));setAccent(saved);btn.addEventListener('click',e=>{if(e.target===btn||btn.contains(e.target)){e.stopImmediatePropagation();const light=root.classList.contains('light');root.classList.toggle('light',!light);localStorage.setItem('redlighte_theme',!light?'light':'dark');const icon=btn.querySelector('.theme-icon'),name=btn.querySelector('.theme-name');if(icon)icon.textContent=!light?'☀':'☾';if(name)name.textContent=!light?'Light':'Dark'}} ,true)})();</script><script type="module" src="/app.js"></script></body></html>
