<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e31b23">
  <meta name="description" content="ردلایت موزیک؛ جستجو و کشف موسیقی، خواننده و آلبوم با تجربه‌ای سریع و فارسی.">
  <title>ردلایت موزیک | کشف موسیقی</title>
  <link rel="stylesheet" href="./music.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/music/">Redlighte <span>Music</span></a>
    <nav><a href="/music/">خانه</a><a href="#results">نتایج</a></nav>
  </header>
  <main>
    <section class="hero">
      <div class="badge">🎵 موسیقی برای فارسی‌زبان‌ها</div>
      <h1>موسیقی مورد علاقت رو پیدا کن.</h1>
      <p>خواننده، آهنگ یا آلبوم را جستجو کن.</p>
      <form id="searchForm" class="search">
        <input id="q" autocomplete="off" placeholder="مثلاً شادمهر، ابی، Coldplay..." aria-label="جستجوی موسیقی">
        <button>جستجو</button>
      </form>
      <div class="quick"><button data-q="شادمهر">شادمهر</button><button data-q="ابی">ابی</button><button data-q="محسن یگانه">محسن یگانه</button><button data-q="Coldplay">Coldplay</button></div>
    </section>
    <section id="results" class="section">
      <div class="section-head"><h2>نتایج</h2><span id="status"></span></div>
      <div id="grid" class="grid"><div class="empty">برای شروع چیزی جستجو کن 🎧</div></div>
    </section>
  </main>
  <div id="player" class="player hidden"><img id="playerCover"><div><b id="playerTitle"></b><small id="playerArtist"></small></div><audio id="audio" controls preload="none"></audio></div>
  <script src="./music.js"></script>
</body>
</html>
