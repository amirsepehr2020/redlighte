<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808"><meta name="description" content="Redlighte Vault — a simple private space for saving links, notes and useful snippets.">
<title>Redlighte Vault</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#111216;--line:rgba(255,255,255,.09);--text:#f4f4f5;--muted:#8e919a;--red:#ff3045}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(255,48,69,.10),transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input,textarea{font:inherit}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.top{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:850;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;margin-top:2px}.account{font-size:11px;color:var(--muted);padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#111216}.hero{padding:48px 0 30px}.eyebrow{color:#ff6675;font-size:10px;font-weight:800;letter-spacing:.14em}.hero h1{font-size:clamp(34px,7vw,58px);line-height:1;margin:10px 0}.hero p{color:var(--muted);max-width:570px;line-height:1.7;font-size:14px}.bar{display:flex;gap:10px;margin:25px 0}.bar input{flex:1;min-width:0;background:#111216;border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:white;outline:0}.btn{border:0;border-radius:14px;padding:0 18px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:50px}.card{background:linear-gradient(145deg,#15161a,#101114);border:1px solid var(--line);border-radius:20px;padding:18px;min-height:170px}.tag{font-size:9px;color:#ff6675;font-weight:800;text-transform:uppercase}.card h3{font-size:16px;margin:12px 0 8px}.card p{color:var(--muted);font-size:12px;line-height:1.7;white-space:pre-wrap}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:20px;padding:45px;text-align:center;color:var(--muted)}footer{padding:22px 0 30px;color:#555860;font-size:10px;text-align:center;border-top:1px solid var(--line)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.bar{flex-direction:column}.btn{height:46px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.top{height:62px}.hero{padding-top:35px}}
</style>
</head><body><div class="wrap"><header class="top"><div class="brand">Redlighte Vault<small>PART OF REDLIGHTE INC.</small></div><div class="account" id="account">Redlighte Account</div></header><main><section class="hero"><div class="eyebrow">YOUR PERSONAL SPACE</div><h1>Keep what matters.</h1><p>Save useful links, notes and snippets in one quiet place. Your Vault is designed to work with your Redlighte Account.</p><div class="bar"><input id="search" placeholder="Search your vault…" autocomplete="off"><button class="btn" id="add">＋ Add item</button></div></section><section class="grid" id="grid"></section></main><footer>Redlighte Vault · Part of Redlighte Inc.</footer></div>
<script>
const state={items:JSON.parse(localStorage.getItem('redlighte_vault_items')||'[]')};
const grid=document.getElementById('grid'),search=document.getElementById('search');
function render(){const q=search.value.trim().toLowerCase();const items=state.items.filter(x=>(x.title+' '+x.body+' '+x.type).toLowerCase().includes(q));grid.innerHTML=items.length?items.map(x=>`<article class="card"><div class="tag">${esc(x.type)}</div><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p></article>`).join(''):`<div class="empty">${state.items.length?'Nothing matches your search.':'Your Vault is empty. Add your first item.'}</div>`}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
document.getElementById('add').onclick=()=>{const title=prompt('Title');if(!title)return;const body=prompt('Note or link');if(body===null)return;const type=prompt('Type (note, link, code…)','note')||'note';state.items.unshift({title,body,type});localStorage.setItem('redlighte_vault_items',JSON.stringify(state.items));render()};search.oninput=render;render();
</script></body></html>
