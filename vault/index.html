<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0d"><meta name="description" content="Redlighte Vault 2.0 — your private workspace for notes, links, code and ideas."><title>Redlighte Vault</title><style>
:root{color-scheme:dark;--bg:#08090b;--panel:#111318;--panel2:#17191f;--line:rgba(255,255,255,.09);--text:#f5f5f7;--muted:#92959e;--red:#ff3045;--red2:#ff6473}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(255,48,69,.13),transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.15em;margin-top:2px}.account{font-size:11px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted)}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px;padding:24px 0 50px}.side{position:sticky;top:18px;height:max-content}.side button{display:flex;width:100%;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:11px;text-align:left;gap:9px}.side button.active,.side button:hover{background:var(--panel);color:#fff}.section{margin:18px 8px 7px;color:#5f626a;font-size:9px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:14px 0 20px}.hero h1{font-size:clamp(32px,6vw,54px);line-height:1;margin:0 0 8px;letter-spacing:-.05em}.hero p{margin:0;color:var(--muted);font-size:13px}.primary{border:0;background:var(--red);color:#fff;border-radius:13px;padding:12px 16px;font-weight:800;white-space:nowrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:#fff;outline:0}.select{background:var(--panel);border:1px solid var(--line);border-radius:13px;color:#fff;padding:0 12px;outline:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:linear-gradient(145deg,#14161b,#101114);border:1px solid var(--line);border-radius:16px;padding:13px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{position:relative;background:linear-gradient(145deg,#15171c,#101114);border:1px solid var(--line);border-radius:18px;padding:17px;min-height:175px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:rgba(255,48,69,.3)}.card .actions{position:absolute;right:11px;top:10px;display:flex;gap:5px}.icon{width:29px;height:29px;border:1px solid var(--line);border-radius:9px;background:#0d0e11;color:#888}.icon:hover{color:#fff}.icon.fav{color:#ffcf5c}.type{font-size:9px;color:var(--red2);font-weight:900;text-transform:uppercase;letter-spacing:.12em}.card h3{font-size:16px;margin:14px 62px 7px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card p{color:var(--muted);font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.chip{font-size:9px;color:#bbb;background:#0b0c0f;border:1px solid var(--line);border-radius:99px;padding:4px 7px}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:18px;padding:55px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.65);backdrop-filter:blur(13px);z-index:30}.modal.show{display:grid}.modalbox{width:min(560px,100%);max-height:90vh;overflow:auto;background:#111318;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 25px 90px #000}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.head b{font-size:17px}.close{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:transparent;color:#aaa}.fields{display:grid;gap:10px}.fields input,.fields textarea,.fields select{width:100%;background:#0a0b0e;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}.fields textarea{min-height:150px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{height:45px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:800}.danger{background:#1b1012;color:#ff7180;border:1px solid rgba(255,48,69,.2);border-radius:11px;padding:9px 12px}.collection{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}.collection span{font-size:12px}.muted{color:var(--muted);font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#181a20;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12px;transition:.2s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}footer{text-align:center;color:#555861;font-size:9px;padding:20px;border-top:1px solid var(--line)}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;gap:6px;overflow:auto}.side button{white-space:nowrap;width:auto}.section{display:none}.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.shell{width:min(100% - 20px,1180px)}.grid{grid-template-columns:1fr}.hero{align-items:stretch;flex-direction:column}.primary{width:100%}.row{grid-template-columns:1fr}.top{height:62px}.account{max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
</style></head><body><div class="shell"><header class="top"><div class="brand">Redlighte Vault<small>PART OF REDLIGHTE INC.</small></div><div class="account" id="account">Redlighte Account</div></header><div class="layout"><aside class="side"><button class="active" data-view="all">▣ All Items <span id="allN"></span></button><button data-view="favorites">★ Favorites <span id="favN"></span></button><button data-view="recent">◷ Recent</button><div class="section">Collections</div><div id="collections"></div><button data-view="trash">⌫ Trash <span id="trashN"></span></button></aside><main><section class="hero"><div><h1 id="titleHead">Your Vault.</h1><p id="sub">A private workspace connected to your Redlighte Account.</p></div><button class="primary" id="add">＋ Add item</button></section><div class="stats"><div class="stat"><b id="statItems">0</b><span>ITEMS</span></div><div class="stat"><b id="statFav">0</b><span>FAVORITES</span></div><div class="stat"><b id="statCol">0</b><span>COLLECTIONS</span></div><div class="stat"><b id="statTrash">0</b><span>TRASH</span></div></div><div class="toolbar"><input class="search" id="search" placeholder="Search title, content or tags…" autocomplete="off"><select class="select" id="typeFilter"><option value="">All types</option><option value="note">Notes</option><option value="link">Links</option><option value="code">Code</option><option value="bookmark">Bookmarks</option><option value="checklist">Checklists</option><option value="idea">Ideas</option><option value="document">Documents</option></select><select class="select" id="sort"><option value="updated">Recently updated</option><option value="new">Newest</option><option value="old">Oldest</option><option value="az">A–Z</option></select></div><section class="grid" id="grid"><div class="empty">Loading your Vault…</div></section></main></div><footer>Redlighte Vault · Part of Redlighte Inc.</footer></div>
<div class="modal" id="modal"><div class="modalbox"><div class="head"><b id="modalTitle">Add to Vault</b><button class="close" id="close">×</button></div><form class="fields" id="form"><div class="row"><input id="fTitle" maxlength="120" placeholder="Title" required><select id="fType"><option value="note">📝 Note</option><option value="link">🔗 Link</option><option value="code">💻 Code</option><option value="bookmark">🔖 Bookmark</option><option value="checklist">☑ Checklist</option><option value="idea">💡 Idea</option><option value="document">📄 Document</option></select></div><textarea id="fBody" maxlength="20000" placeholder="Write or paste something…" required></textarea><input id="fTags" maxlength="300" placeholder="Tags — coding, school, idea"><select id="fCollection"><option value="">No collection</option></select><button class="save" id="save">Save to Vault</button></form></div></div>
<div class="modal" id="colModal"><div class="modalbox"><div class="head"><b>Collections</b><button class="close" id="colClose">×</button></div><form class="fields" id="colForm"><input id="colName" maxlength="60" placeholder="Collection name" required><button class="save">Create collection</button></form><div id="colList" style="margin-top:15px"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const state={items:[],trash:[],collections:[],view:'all',edit:null,ready:false};const api=(p,o={})=>fetch(p,{...o,credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json',...(o.headers||{})}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function tags(v){return [...new Set(String(v||'').split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean))].slice(0,12)}
function visible(){let a=state.view==='trash'?state.trash:state.items;const q=$('search').value.trim().toLowerCase(),t=$('typeFilter').value;a=a.filter(x=>(!q||(x.title+' '+x.body+' '+(x.tags||[]).join(' ')+' '+x.type).toLowerCase().includes(q))&&(!t||x.type===t));if(state.view==='favorites')a=a.filter(x=>x.favorite);if(state.view==='recent')a=a.slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,20);const s=$('sort').value;a=a.slice().sort((x,y)=>s==='az'?x.title.localeCompare(y.title):s==='old'?new Date(x.createdAt)-new Date(y.createdAt):s==='new'?new Date(y.createdAt)-new Date(x.createdAt):new Date(y.updatedAt)-new Date(x.updatedAt));return a}
function render(){const a=visible();$('grid').innerHTML=a.length?a.map(x=>`<article class="card"><div class="actions">${state.view!=='trash'?`<button class="icon ${x.favorite?'fav':''}" data-act="fav" data-id="${esc(x.id)}" title="Favorite">★</button><button class="icon" data-act="edit" data-id="${esc(x.id)}" title="Edit">✎</button><button class="icon" data-act="del" data-id="${esc(x.id)}" title="Trash">×</button>`:`<button class="icon" data-act="restore" data-id="${esc(x.id)}" title="Restore">↶</button><button class="icon" data-act="perma" data-id="${esc(x.id)}" title="Delete permanently">×</button>`}</div><div class="type">${esc(x.type)}</div><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><div class="chips">${x.collectionId?`<span class="chip">▣ ${esc((state.collections.find(c=>c.id===x.collectionId)||{}).name||'Collection')}</span>`:''}${(x.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div></article>`).join(''):`<div class="empty">${state.view==='trash'?'Trash is empty.':state.items.length?'Nothing matches your filters.':'Your Vault is empty. Add your first item.'}</div>`;updateStats()}
function updateStats(){$('allN').textContent=state.items.length||'';$('favN').textContent=state.items.filter(x=>x.favorite).length||'';$('trashN').textContent=state.trash.length||'';$('statItems').textContent=state.items.length;$('statFav').textContent=state.items.filter(x=>x.favorite).length;$('statCol').textContent=state.collections.length;$('statTrash').textContent=state.trash.length;$('collections').innerHTML=state.collections.map(c=>`<button data-view="col:${esc(c.id)}">▣ ${esc(c.name)}</button>`).join('')}
function fillCollections(){ $('fCollection').innerHTML='<option value="">No collection</option>'+state.collections.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('') }
async function load(){try{const r=await api('/api/vault');if(r.status===401){location.href='/account?redirect=%2Fvault%2F';return}if(!r.ok)throw Error();const d=await r.json();if(!d.user?.username)throw Error();state.items=Array.isArray(d.items)?d.items:[];state.trash=Array.isArray(d.trash)?d.trash:[];state.collections=Array.isArray(d.collections)?d.collections:[];state.ready=true;$('account').textContent=d.user.name||'@'+d.user.username;fillCollections();render()}catch{ $('grid').innerHTML='<div class="empty">Vault could not be loaded right now. <button class="primary" onclick="load()">Retry</button></div>'}}
function openAdd(item=null){if(!state.ready)return;state.edit=item?.id||null;$('modalTitle').textContent=item?'Edit item':'Add to Vault';$('fTitle').value=item?.title||'';$('fType').value=item?.type||'note';$('fBody').value=item?.body||'';$('fTags').value=(item?.tags||[]).join(', ');fillCollections();$('fCollection').value=item?.collectionId||'';$('modal').classList.add('show');$('fTitle').focus()}
async function mutate(body){const r=await api('/api/vault',{method:'POST',body:JSON.stringify(body)});if(r.status===401){location.href='/account?redirect=%2Fvault%2F';return null}if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'Request failed')}return r.json()}
$('add').onclick=()=>openAdd();$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('close').click()};$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const base={title:$('fTitle').value,body:$('fBody').value,type:$('fType').value,tags:tags($('fTags').value),collectionId:$('fCollection').value};const d=await mutate(state.edit?{action:'update',id:state.edit,...base}:{action:'create',...base});if(!d)return;if(state.edit){const i=state.items.findIndex(x=>x.id===state.edit);if(i>=0)state.items[i]=d.item}else state.items.unshift(d.item);$('modal').classList.remove('show');render();toast(state.edit?'Item updated':'Item added')}catch(e){toast(e.message)}finally{$('save').disabled=false}}
$('grid').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id,act=b.dataset.act;try{if(act==='fav'){const x=state.items.find(x=>x.id===id);const d=await mutate({action:'update',id,favorite:!x.favorite});x.favorite=d.item.favorite;render();return}if(act==='edit'){openAdd(state.items.find(x=>x.id===id));return}if(act==='del'){if(!confirm('Move this item to Trash?'))return;const r=await api('/api/vault?id='+encodeURIComponent(id),{method:'DELETE'});if(!r.ok)throw Error();const i=state.items.findIndex(x=>x.id===id);const x=state.items.splice(i,1)[0];x.deletedAt=new Date().toISOString();state.trash.unshift(x);render();toast('Moved to Trash');return}if(act==='restore'){const d=await mutate({action:'restore',id});const i=state.trash.findIndex(x=>x.id===id);state.trash.splice(i,1);state.items.unshift(d.item);render();toast('Restored');return}if(act==='perma'){if(!confirm('Permanently delete this item?'))return;await mutate({action:'permanent_delete',id});state.trash=state.trash.filter(x=>x.id!==id);render();toast('Deleted permanently')}}catch{toast('Could not complete that action')}};
$('search').oninput=render;$('typeFilter').onchange=render;$('sort').onchange=render;$('collections').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('active',x===b));$('titleHead').textContent=state.view==='trash'?'Trash.':state.view==='favorites'?'Favorites.':state.view==='recent'?'Recently used.':state.view.startsWith('col:')?((state.collections.find(c=>c.id===state.view.slice(4))||{}).name||'Collection.'):'Your Vault.';render()};document.querySelector('.side').onclick=e=>{const b=e.target.closest('button[data-view]');if(!b)return;if(b.parentElement.id==='collections')return;state.view=b.dataset.view;document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('active',x===b));$('titleHead').textContent=state.view==='trash'?'Trash.':state.view==='favorites'?'Favorites.':state.view==='recent'?'Recently used.':'Your Vault.';render()};
$('colForm').onsubmit=async e=>{e.preventDefault();try{const d=await mutate({action:'collection_create',name:$('colName').value});state.collections.push(d.collection);$('colName').value='';fillCollections();updateStats();render();toast('Collection created')}catch(e){toast(e.message)}};$('colClose').onclick=()=>$('colModal').classList.remove('show');
const cm=document.createElement('button');cm.textContent='＋ New collection';cm.className='side-add';cm.style='margin:8px 0;color:#ff6675';cm.onclick=()=>$('colModal').classList.add('show');$('collections').after(cm);load();
</script></body></html>
